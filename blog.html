const POSTS = [
  {
    id: 'post6',
    tag: 'tech',
    tagLabel: 'Tech',
    date: 'August 2026',
    readTime: '8 min read',
    title: 'DevFest DC \u201926: Build Edition',
    preview: 'Notes and takeaways from DevFest DC \u2019s AI-adoption keynote, a policy panel on building responsibly, and what it means to lead through a legacy-system, AI-adopting federal team.',
    body: `
      <p><a href="https://www.devfestdc.org/" target="_blank" rel="noopener" style="color:var(--accent); text-decoration:underline;">DevFestDC</a> is an annual, community-led software engineering conference designed to educate developers, architects, entrepreneurs, quality-focused folks, and tech leaders. This year's theme was "Build Edition" and I went in with a pretty specific goal: I wasn't just there to sit and absorb talks, I was looking for ways to be a better leader as I keep growing into my senior developer role.</p>
 
      <p>Naveen Nigam (Head of Developer Ecosystem, Google) kicked things off by talking about how his team stays developer focused first, and how most people right now are in the same boat when it comes to AI. Most people ask, "Hey, where do I start? I want to work in this but I don't know how." His advice was to keep attending events like this because just sitting and listening to talks isn't enough on its own. Networking, hearing other people's journeys and advice, is the way to learn. He also pointed people to <a href="https://developers.google.com" target="_blank" rel="noopener" style="color:var(--accent); text-decoration:underline;">developers.google.com</a> for code labs and actual structured ways to learn instead of just watching.</p>
      
      <p>William Lopez, CEO of BuildWithin, followed up with a plug for a regional initiative called <a href="https://www.talentcapital.ai" target="_blank" rel="noopener" style="color:var(--accent); text-decoration:underline;">talentcapital.ai</a>, which connects job seekers with hundreds of employers across the DMV.</p>
 
      <h2>The DORA keynote</h2>
      <p>This was the talk I keep thinking about, and it kicking off DevFest made it so much more impactful. Nathan Harvey (Google) talked about DORA \u2014 the research program studying the capabilities that let technology-driven teams and orgs actually "get better at getting better," and not just working on your machine, but shipping something other people can use. He put it bluntly: it sucks to build something, hand it off, and have someone tell you three months later it doesn't work, when you can barely remember what you did three months ago.</p>
      <p>Then into AI adoption specifically. Everyone's using it. Most people feel like it's making them more productive. But does it make the codebase better? Shakier answer: it depends a lot on how you're using it. His line that stuck with me: "Do not trust AI output blindly. You need to verify what the AI is saying." Obviously there's a push to use AI everywhere, but this is why it's so important to know what you're looking at before you push the code. And there's a feedback loop underneath that: the more you use something, and you verify the output, the more you trust it, and the more you trust it, the more you use it. AI's primary role in software development, in his framing, is that of an amplifier.</p>
      <p>The biggest returns come from a strategic focus on the underlying AI systems themselves. Without that focus, AI just creates localized pockets of productivity that get lost to downstream chaos. We generate code faster with AI, but if we don't validate the output and we don't scale the code review process to match, everything just slows down anyway \u2014 so are we actually more productive? Individual effectiveness goes up (feels good!), but software delivery instability can increase right alongside it. You push something to prod, someone around you freaks out, you need to roll back, you need a hotfix. As AI adoption increases, so do rollbacks and hotfixes, for exactly this reason. Are we really more productive in this case? And what even measures productivity at this point?</p>
      
      <p>Nathan also described a J-curve: whenever you take on something new, you see an immediate dip in productivity before you get better with the tool and it really takes off. But you have to actually use the tool to get there. You can't use it, stop for six months, and expect to pick back up where you left off. The only way to learn is by doing, not by reading or watching videos about it. And when we start learning, things feel uncomfortable and downright worse initially.</p>
      <p>He then walked through DORA's AI Capabilities model \u2014 seven things a team needs in order to use AI well: a clear and communicated stance (what's off limits, like PII, what models are approved), a healthy ecosystem and AI-accessible internal data (if the AI can't reach your data, it can't help you make the right call), strong version control practices, working in small batches (small things driven to completion beats big things left half-done, and AI performs better on smaller tasks anyway), a user-centric focus (every piece of software we build ultimately serves a human, so who are your users \u2014 developers, agents, builders?), good documentation for both agents and humans, and quality internal platforms.</p>
      <p>Nathan closed with a question worth sitting with: what's stopping you from "YOLO-ing AI-written code straight to production?" Security, bugs, trust, someone even said Jesus. The fix isn't to slow down AI adoption, it's to build a platform good enough that people can build what they want on it and actually trust it. He quoted W. Edwards Deming: <em>"A bad system will beat a good person every time."</em> It doesn't matter how well-intentioned you are, because if the system's poorly designed, the system is what has to change. Build a sustainable system, have the courage to protect platform engineering, and keep getting better at getting better. You can't do it alone, and there's a whole community around this at <a href="https://dora.dev/ai/" target="_blank" rel="noopener" style="color:var(--accent); text-decoration:underline;">dora.dev/ai</a>. Which, you already know, I joined!</p>
 
      <h2>Sessions</h2>
      <p>Amanda J Kendal-Brown (Capital One) gave a talk called "Two Tablets, One Bench," about building real time multiplayer at the edge with Durable Objects and Workers AI, for tracking penalties and points in roller derby. What I loved was how it started. The speaker wrote her notes by hand first, working from "I want this so I can do this." Roller derby has the exact same core problem as collaborative whiteboards, multi user POS systems, live scoring, shared dashboards, pair programming editors, you have real users at the same time, often on bad venue wifi, with zero patience for logging in. Coaches need to open the app and have it just work, instantly, offline friendly, no accounts needed. They built it on Cloudflare with a React frontend on Cloudflare Pages and it was such a cool example of building for exactly who's going to use the thing.</p>
      <p>John Lee and Rezaur Rahman (SZNS) gave a talk called "Building AI Systems at Scale" that got into how agents actually operate, foundationally it's ReAct, and why structured data is so much harder for a model to read than you'd think, since developers decide the naming conventions and any inconsistency there can cause hallucinations. What's good for humans is also good for agents, they said, and that's stuck with me. Their bigger point was you shouldn't just slap AI on top of an existing system for doc generation or whatever, it's better to build AI into the system from the start with an eye toward where a model's capabilities will be a year or a year and a half out. You don't want to finish building a system and realize you built last year's AI. Part of that means actually reading research papers and staying current, since there's a real cutoff to what any model already knows (this one is August 2026, for context), and part of where the industry is pushing right now is toward continuous learning environments that don't have that ceiling at all.</p>
 
      <h2>AI policy</h2>
      <p>Naveen Nigam came back for a panel with Chris Grimm and Andrew Gamino-Cheong (Developers Alliance) on AI policy and data privacy, and this was the other talk I keep thinking about. Most policymakers have no idea how to build an app, which basically means it's on us to help our organizations stay compliant while staying current too.</p>
      <p>Choosing a model for a task isn't just about efficiency and cost anymore, it's about risk. Disclose that you're using AI. Trying to pass an AI system off as human is a real problem. There's a lot of attention right now on AI being used for critical life decisions like healthcare, finance, and employment, and states are actively writing laws around algorithmic decision making in those sectors. Bias came up too, and the take was that there's real capability to overcome human bias with these systems, but you have to be able to prove there isn't something illegal happening underneath it. Audit. Keep an eye on this space.</p>
      <p>Anything that touches minors is under a lot of scrutiny right now, and honestly, age verification still feels like an unsolved problem. Even if your app isn't intended for anyone under 18, you have to think about what happens if someone under 18 ends up using it anyway. Or someone under 16. Or 13. Or 10.</p>
      <p>Their bottom line was to figure out where your app actually sits in this landscape and to do a real risk assessment, thinking through the ten most likely bad things that could happen with the AI you're building and how likely and how severe each one really is. It's basically the same instinct as chaos engineering that I learned about last DevFest. You're trying to prevent foreseeable harm before it happens instead of patching it after. There are whole repositories out there cataloguing the ways AI has gone wrong and it's worth sitting with them for a while. Even a "perfect" model doesn't get you off the hook, you still have to think about the human and ethical side. You can't just upload everyone's resume even if the system is secure. Is that ethical? Should AI be allowed to tell someone if Santa Claus is real? Should it write greeting cards to loved ones? Genuinely asked, and genuinely worth sitting with.</p>
 
      <h2>What I'm taking with me</h2>
      <p>The DORA discussion was the one that hit hardest, mostly because of how directly it maps onto working in government, where most of what we touch is a legacy system. Constant state of reaction is a pretty accurate summary of my day to day, especially as we push further into AI adoption. Updates go out, quality issues show up, friction and burnout creep in, and we're always a little on the defense. The idea that we adopt what we trust, and we trust what we adopt, is going to stick with me for a while. I didn't even know what DORA was before this conference, and I walked away wanting to get better at getting better, like Nathan said. As I keep growing as a senior developer this feels directly relevant to how I lead the junior developers on my team and take ownership of federal projects that are leaning harder into AI every quarter.</p>
      <p>The AI policy conversation landed the same way and for the same reason. When we build things in the federal space we have to think about every possible user, not just the intended one, what happens if this ends up in front of someone under 18, under 15, under any age we didn't design for. It's the same muscle as the chaos engineering talk from last DevFest, which I still find myself reaching for in the brainstorming and design phase of pretty much anything I build. Don't just build the happy path, build for the edge cases you hope never happen. I came into this DevFest looking for ways to be a better leader and I'm leaving with a lot to actually put into practice.</p>
    `
  },

    title: 'Turtles All the Way Down: What if I\'m not real?',
    preview: 'On OCD, identity, and watching a movie on a plane that made me feel, for the first time, completely understood.',
    body: `
      <p>I've been grappling with the reality of living with OCD: my sense of self and my personal identity perpetually feel uncertain. It's an odd feeling, not trusting your perception of the way things are. Not trusting who you are, or what you're capable of.</p>
 
      <h2>On the plane</h2>
      <p>I was on the plane back from Austin and I was anxious. Shocker. I don't like flying. I especially do not like it when I'm alone stuck with my thoughts in a vessel I cannot escape. If I have a particularly disturbing intrusive thought, I panic. If I have a panic attack, I can't just stop the plane and run to refuge. I can't call my sister to deescalate. I struggle to implement ERP when the thought runs like an endless loop in my head: <em>"I can't escape"</em>, in both the physical and mental aspect.</p>
      <p>I saw John Green's <em>Turtles All the Way Down</em> available as a movie to watch for in-flight entertainment. I read the book long before I started exhibiting OCD symptoms, and I remember relating to Aza's plight to an extent as a person with an anxiety disorder, but I also remember being troubled and disturbed at the way her obsessions plagued every second of her existence.</p>
      <p>I distinctly remember thinking, <em>"This is a horrible way to live"</em> and being so grateful I didn't have to live that way.</p>
 
      <h2>I am Aza</h2>
      <p>So it was surreal to be watching the film adaptation of the book that made me so uncomfortable back then because I now live Aza's reality. <strong>I am Aza.</strong> Thoughts attack my identity on loop 24/7, making me feel so sick, making existing feel so difficult at times.</p>
      <p>Aza mentions feeling like those Russian nesting dolls, and you keep opening them until you find one that's solid. But she feels like with her, with her condition, there is no solid doll. I'd never felt so understood until I watched that part. The very nature of OCD, the aspect that continues to haunt me, put into words so eloquently: <em>I don't feel solid. I don't feel real. I don't know who I am.</em></p>
 
      <h2>The spiral</h2>
      <p>I think I wonder, if I'm not my thoughts, then who am I? What am I? Who am I if my brain pokes holes in everything I thought to be true? What even is the truth? And how do I definitely know?</p>
      <p>Another common theme in the movie was this idea of a thought spiral, which is exactly what I'm doing in the previous sentences. Spiraling. The infinite loop of anxiety-driven fears. And the spiral never ends, just tightens infinitely. There is no certainty to assuage the fears. It's a terrible headspace to be in.</p>
      <p>I so empathize with Aza's plight, and while my specific flavor of OCD isn't the same as hers, her experience is a mirror to mine and many others living with the disorder. I'm long due for a reread of the book, but I encourage everyone to pick up a copy or to watch the movie to get what I feel is an accurate glimpse into the OCD experience. Portrayals of OCD like this in the media gives insight into this misunderstood condition without making the sufferer a caricature or a typecast. Aza is human. <strong>Aza is real.</strong></p>

    body: `
      <p>My compulsions stem from an innate need to feel perfect. To get things <em>just right.</em> That part of OCD that is impossible to satisfy: the chasing of certainty, the perfectionism that has no finish line. It followed me into my software engineering career, and at some point, it felt like a switch was flipped.</p>
      <h2>Before</h2>
      <p>I used to write code and check it once. I felt confident in what I shipped. I could speak to what I'd written with ease. And then one day, that felt impossible.</p>
      <h2>The spiral</h2>
      <p>My fingers would hover over the keys and I'd question everything. What I was typing, why I was typing it, whether the letters made sense, whether my understanding was actually correct. I convinced myself I was illiterate. Uneducated. Useless. When I'd finally write something, it felt wrong, and so I'd check outputs for hours. Burn the midnight oil by triple-checking everything was as intended, if I could even convince myself of what that was.</p>
      <p>A senior developer is supposed to do these things with ease. A person is not supposed to second guess everything that was once so automatic. And I was failing what felt like the most basic of tasks, as both a developer and a human being.</p>
      <h2>What I learned</h2>
      <p>This is not normal. Suffering like this is not normal, and I shouldn't have had to white-knuckle through that uncertainty, ruminating and wracking my brain for evidence of certainty for hours, while convincing myself everything was fine.</p>
      <p>OCD does a great job at making you feel like something is so fundamentally wrong with you that "normal" isn't viable, that things will always be this way. They don't have to be. Help exists for this. Working with a therapist and engaging in ERP, allowing these thoughts, no matter how debilitating, to pass through rather than compulsively neutralizing them, made the difference for me.</p>
      <h2>Where I'm at now</h2>
      <p>I'm not 100%. There are still days I fall into that spiral, into the trap my brain produces. But it's easier to tolerate. And it's easier to forgive myself. That's not nothing. That's everything.</p>
      <p>If any of this sounds familiar: you're not broken, you're not useless, and you don't have to figure this out alone.</p>
    `

    title: 'Reachy Mini - Day 0',
    preview: 'Starting from zero on robotics. No background, no robot yet, just a simulation and a lot of questions.',
    body: `
      <p>One of the coolest things about <a href="https://huggingface.co/reachy-mini" target="_blank" rel="noopener" style="color:var(--accent); text-decoration:underline;">Reachy Mini</a> (aside from the fact that it's an adorable lil open-source robot that can talk, move, and even dance) is the fact that you can actually play with it without having a physical Reachy in front of you.</p>

      <p>While I anxiously await for my robot \u2013 which I've lovingly named Babymax for the obvious resemblance to the Big Hero 6 character, more on that later \u2013 to make its way to Arlington, Virginia, I've been doing some research and found that I can run a simulation and interact with the robot in there, playing around with Python.</p>

      <p>Pretty neat, huh?</p>

      <p>Currently, the code to make the robot do ANYTHING is high level. Easier for me, since the code hides all of the complexity like inverse kinematics (what?!), I can focus on building intelligence. I can make Babymax dance without having to manually rotate every single motor one by one. But, if I ever need to get under the hood, the system is flexible enough to let me talk to the motors and sensors directly through the daemon (The Vampire Diaries, anyone?) Let's break some things down, as someone with zero robotics background.</p>

      <ul style="list-style:none; display:flex; flex-direction:column; gap:0.6rem; margin: 1rem 0 1rem 0.5rem;">
        <li style="padding-left:1rem; position:relative; font-size:0.975rem; color:var(--ink-muted); line-height:1.75;"><span style="position:absolute;left:0;color:var(--ink-faint);">\u2014</span><strong style="color:var(--ink);">The Daemon</strong> \u2013 the "middleman" or translator. A background service that runs continuously. It takes to the physical hardware or, in my case, the simulation on one side and exposes an API (talking to the Python script) on another.</li>
        <li style="padding-left:1rem; position:relative; font-size:0.975rem; color:var(--ink-muted); line-height:1.75;"><span style="position:absolute;left:0;color:var(--ink-faint);">\u2014</span><strong style="color:var(--ink);">MuJoCo</strong> \u2013 the physics engine. It simulates the real world inside of my computer, calculating gravity, friction, collision, and momentum. Pretty important stuff. When my high-level code sends a command to move, MuJoCo calculates exactly what that move would look like in a 3D space.</li>
      </ul>

      <p>When I run a command like <code style="font-size:0.875rem; background:rgba(26,25,23,0.06); padding:0.15rem 0.4rem; border-radius:4px;">reachy-mini-daemon --sim</code> (more on this later. This starts the daemon in simulation mode, telling it to connect to the virtual robot instead of a physical one), I'm basically telling the computer to ignore the real robot and pretend its connected to the virtual robot inside the physics engine. The daemon keeps the simulation running, it waits for my commands, and we can get the virtual robot to interact!</p>

      <h2>What does this mean for the real Reachy?</h2>

      <p>When I get the real robot, because we can run with the daemon, my code doesn't change at all.</p>
      <p>In the simulation, I run the daemon with <code style="font-size:0.875rem; background:rgba(26,25,23,0.06); padding:0.15rem 0.4rem; border-radius:4px;">--sim</code> (that's the part that says "use the virtual robot"), tell it to "move head left" and the physics engine gets updated via the Daemon.</p>
      <p>Then when I get the real robot, I'll plug it into my computer's USB port, I'll run the daemon without the <code style="font-size:0.875rem; background:rgba(26,25,23,0.06); padding:0.15rem 0.4rem; border-radius:4px;">--sim</code> flag, and when my code says "move head left", the daemon will send actual electrical signals to the physical motors in the robot's neck.</p>

      <p><b>TL;DR:</b> because the SDK talks to the daemon, not the hardware directly, I can write all of my code in the simulation and then just plug in Babymax when the time comes without rewriting a single line of code.</p>

      <p>I created a document to set up the simulation here: <a href="https://github.com/dianadelg/roboticsReachyMini/blob/main/Reachy%20Mini%20Install%20Instructions%20-%20Windows.pdf" target="_blank" rel="noopener" style="color:var(--accent); text-decoration:underline;">Reachy Mini Install Instructions (Windows)</a>.</p>
      <p>While I was trying to set this up, I ran into a few things, and I figured it's important to share this process with anyone else who's new.</p>

      <ul style="list-style:none; display:flex; flex-direction:column; gap:0.6rem; margin: 1rem 0 1rem 0.5rem;">
        <li style="padding-left:1rem; position:relative; font-size:0.975rem; color:var(--ink-muted); line-height:1.75;"><span style="position:absolute;left:0;color:var(--ink-faint);">\u2014</span>I had an old version of python. Had to update to something between 3.10 and 3.13 (the official docs recommend 3.12 specifically).</li>
        <li style="padding-left:1rem; position:relative; font-size:0.975rem; color:var(--ink-muted); line-height:1.75;"><span style="position:absolute;left:0;color:var(--ink-faint);">\u2014</span>I needed to install the WSL (Windows Subsystem for Linux), which provides a linux environment where the robot's software expects to live, preventing crashes caused by missing unix files. Initially I tried to install everything on my local and\u2026yeah. I needed a dedicated virtual environment, so dependencies didn't conflict. I don't really know what was going on but it was a lot and scary and super intimidating for someone new to this.</li>
        <li style="padding-left:1rem; position:relative; font-size:0.975rem; color:var(--ink-muted); line-height:1.75;"><span style="position:absolute;left:0;color:var(--ink-faint);">\u2014</span>Make sure I installed both the daemon AND the sdk. For simulation specifically, you'll want <code style="font-size:0.875rem; background:rgba(26,25,23,0.06); padding:0.15rem 0.4rem; border-radius:4px;">pip install "reachy-mini[mujoco]"</code> \u2014 <code style="font-size:0.875rem; background:rgba(26,25,23,0.06); padding:0.15rem 0.4rem; border-radius:4px;">pip install</code> is how you tell Python to download and install a package, and the <code style="font-size:0.875rem; background:rgba(26,25,23,0.06); padding:0.15rem 0.4rem; border-radius:4px;">[mujoco]</code> part is an "extra" that also pulls in the physics engine bindings you need for the simulation to run.</li>
        <li style="padding-left:1rem; position:relative; font-size:0.975rem; color:var(--ink-muted); line-height:1.75;"><span style="position:absolute;left:0;color:var(--ink-faint);">\u2014</span>Before I tried to execute any python commands, I had to make sure the simulation was running <code style="font-size:0.875rem; background:rgba(26,25,23,0.06); padding:0.15rem 0.4rem; border-radius:4px;">reachy-mini-daemon --sim</code>. This launches the daemon in simulation mode and opens the 3D viewer window, without this running first, your Python script has nothing to talk to. Seems obvious now but I wasn't sure how things connected at first and this was clearly a missing piece. I think I started with the method of "hey let's get something to run first." Would've saved me some time!</li>
        <li style="padding-left:1rem; position:relative; font-size:0.975rem; color:var(--ink-muted); line-height:1.75;"><span style="position:absolute;left:0;color:var(--ink-faint);">\u2014</span>The repository for Reachy states that it's supported and tested on Linux and macOS. Windows, not so much. We need that MuJoCo engine to run our code, but windows makes this funky (GPU drivers, display context\u2026things get wonky.) At one point, I was trying to bypass this using a docker image and running the simulator in Docker, but it is not public. Enter WSL (Linux inside windows). Required me to download Ubuntu and run the simulator that way, install Reachy and the simulator dependencies in there. Also make sure your packages are updated. In Ubuntu you can do that with <code style="font-size:0.875rem; background:rgba(26,25,23,0.06); padding:0.15rem 0.4rem; border-radius:4px;">sudo apt update && sudo apt upgrade</code>, which just checks for and installs any pending system updates.</li>
        <li style="padding-left:1rem; position:relative; font-size:0.975rem; color:var(--ink-muted); line-height:1.75;"><span style="position:absolute;left:0;color:var(--ink-faint);">\u2014</span>The dependencies were also funky. I ended up having to remove and reinstall things a few times (thanks to GPT for helping me troubleshoot.)</li>
        <li style="padding-left:1rem; position:relative; font-size:0.975rem; color:var(--ink-muted); line-height:1.75;"><span style="position:absolute;left:0;color:var(--ink-faint);">\u2014</span>Make sure you're installing the correct Reachy simulator. There are versions out there.</li>
        <li style="padding-left:1rem; position:relative; font-size:0.975rem; color:var(--ink-muted); line-height:1.75;"><span style="position:absolute;left:0;color:var(--ink-faint);">\u2014</span>Make sure your Reachy environment is configured correctly. We need an isolated environment to install the Reachy SDK. This is basically a contained little bubble for Python so the packages you install for Reachy don't collide with packages you have installed for other projects.</li>
      </ul>

      <p>Well that was a journey, but we got there. My first crack and this whole robotics thing, and it was interesting (and frustrating, but no one said this would be easy). I'm eager and excited to continue while I patiently wait for Babymax to make his way into the world :') </p>
    `
  }

const TAG_CLASS = { tech: 'tag-tech', mental: 'tag-mental', career: 'tag-career', education: 'tag-education' };
const PILL_ACTIVE = { all: 'active-all', tech: 'active-tech', mental: 'active-mental', career: 'active-career', education: 'active-education' };

let currentFilter = 'all';
let currentSearch = '';
let openPostId = null;

function getFilteredPosts() {
  return POSTS.filter(p => {
    const matchesFilter = currentFilter === 'all' || p.tag === currentFilter;
    const q = currentSearch.toLowerCase();
    const matchesSearch = !q || p.title.toLowerCase().includes(q) || p.preview.toLowerCase().includes(q) || p.tagLabel.toLowerCase().includes(q);
    return matchesFilter && matchesSearch;
  });
}

function renderPosts() {
  const layout = document.getElementById('posts-layout');
  const posts = getFilteredPosts();
  const countEl = document.getElementById('post-count');

  countEl.textContent = posts.length === 1 ? '1 post' : `${posts.length} posts`;

  if (posts.length === 0) {
    layout.innerHTML = `<div class="empty-state"><span class="empty-icon">\u270d\ufe0f</span><p>No posts match that search.<br>Try a different term or filter.</p></div>`;
    return;
  }

  layout.innerHTML = posts.map(p => {
    const isOpen = openPostId === p.id;
    return `
      <article class="post-card${isOpen ? ' open' : ''}" id="card-${p.id}" onclick="togglePost('${p.id}')">
        <div class="post-card-header">
          <div class="post-card-header-row">
            <span class="blog-tag ${TAG_CLASS[p.tag]}">${p.tagLabel}</span>
            <div class="expand-icon" aria-label="${isOpen ? 'Collapse' : 'Expand'} post">
              <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </div>
          </div>
          <h2>${p.title}</h2>
          <p class="post-card-preview">${p.preview}</p>
          <div class="post-card-meta">${p.date} \u00b7 ${p.readTime}</div>
        </div>
        <div class="post-body-wrap">
          <div class="post-body">${p.body}${p.video ? `<div class="post-video"><iframe src="${p.video}" allowfullscreen loading="lazy"></iframe></div><p class="post-video-caption">${p.videoCaption || ''}</p>` : ''}</div>
        </div>
      </article>
    `;
  }).join('');
}

function togglePost(id) {
  if (openPostId === id) {
    openPostId = null;
  } else {
    openPostId = id;
  }
  renderPosts();
  if (openPostId) {
    setTimeout(() => {
      const card = document.getElementById('card-' + openPostId);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 60);
  }
}

function setFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.pill').forEach(p => {
    const f = p.dataset.filter;
    p.className = 'pill';
    if (f === filter) p.classList.add(PILL_ACTIVE[f]);
  });
  renderPosts();
}

document.querySelectorAll('.pill').forEach(btn => {
  btn.addEventListener('click', () => setFilter(btn.dataset.filter));
});

document.getElementById('search-input').addEventListener('input', e => {
  currentSearch = e.target.value;
  renderPosts();
});

function handleDeepLink() {
  const params = new URLSearchParams(window.location.search);
  const postParam = params.get('post');
  if (postParam && POSTS.find(p => p.id === postParam)) {
    openPostId = postParam;
  }
}

handleDeepLink();
renderPosts();
</script>
